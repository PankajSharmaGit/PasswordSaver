name: passwordsaver
description: End-to-end encrypted password vault with Clean Architecture and Firebase.
publish_to: 'none'
version: 9.20.102+15

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  cloud_functions: ^5.6.2
  google_sign_in: ^6.3.0

  # Security & encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  screen_protector: ^1.4.2+1

  # Device info
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  uuid: ^4.5.1

  # Ads
  google_mobile_ads: ^5.3.1

  # UI helpers
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.1
  share_plus: ^12.0.2
  file_picker: ^10.1.9
  flutter_image_compress: ^2.4.0
  path: ^1.9.1
  url_launcher: ^6.3.1
  mime: ^2.0.0
  razorpay_flutter: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#D0E2F5"
  adaptive_icon_foreground: assets/icons/app_icon.png
  min_sdk_android: 23
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#D0E2F5"
    theme_color: "#1E5FAF"
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
